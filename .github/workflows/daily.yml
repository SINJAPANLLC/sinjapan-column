name: Daily Generate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # JST 03:00（UTC 18:00）

permissions:
  contents: write

concurrency:
  group: daily-generate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi

      - name: Generate 10 articles (weighted random)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          node scripts/generate.mjs --n 10

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/feed/index.json public/feed/articles public/**/*.html public/sitemap.xml
          git commit -m "daily: generate 10 articles" || true

          git pull --rebase
          git push
