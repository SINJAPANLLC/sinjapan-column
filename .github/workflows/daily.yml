name: daily-generate

permissions:
  contents: write

on:
  schedule:
    - cron: "0 22 * * *" # JST 07:00（UTC 22:00）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate article (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate.mjs

      - name: Commit & Push
        run: |
          git config user.name "sinjapan-bot"
          git config user.email "bot@sinjapan.work"
          git add public/feed/index.json public/**/*.html public/sitemap.xml || true
          git commit -m "daily: generate" || exit 0
          git push
