<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sinjapan-column</title>
<style>
body{font-family:sans-serif;margin:40px}
.card{border:1px solid #ddd;padding:12px;margin:12px 0}
</style>
</head>
<body>
<h1>sinjapan-column</h1>
<div id="list"></div>

<script>
fetch("./public/feed/index.json")
.then(r=>r.json())
.then(data=>{
  const el=document.getElementById("list");
  data.forEach(a=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <a href="public/${a.slug}"><h3>${a.title}</h3></a>
      <div>${a.date} / ${a.category}</div>
      <p>${a.description}</p>
    `;
    el.appendChild(div);
  });
});
</script>
</body>
</html>
